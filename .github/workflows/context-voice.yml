name: NewAI context and voice smoke

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Discord and local runtime dependencies
        run: npm ci --no-audit --no-fund
      - name: Check context isolation and receive/decode logic
        run: node --test test/context-voice.test.js
      - name: Check training and speech module syntax
        run: python3 -m compileall -q model
