name: NewAI daily model

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare training data and fit model
        run: |
          python3 model/fetch_dataset.py
          python3 model/prepare_daily.py
          python3 model/daily_model.py train
          cp dataset/daily/preparation.json checkpoints/daily-final/
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/songys/Chatbot_data/4cf20d13fc46f5037fd1c531cd566e2dd9f72974/LICENSE -o checkpoints/daily-final/Song-Chatbot-data-LICENSE.txt
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/NewLandTV/UA-N1-Queen/5a653644a2452583a16a29d766e01e1d20a5d180/LICENSE -o checkpoints/daily-final/UA-N1-Queen-LICENSE.txt
      - name: Verify selected model through the bot's local bridge
        run: node --test test/daily-model.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: newai-daily-model
          path: checkpoints/daily-final/
          if-no-files-found: error
          retention-days: 30
